# Registry dependencies only: unpublished workspace crates are PGX source.
[graph]
all-features = false

[advisories]
git-fetch-with-cli = true
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "0BSD", "Unicode-3.0", "Zlib"]
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
