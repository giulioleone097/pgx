# Cloudflare Worker that serves https://pgx.dev/install (see install-worker.js).
# PREPARED, NOT DEPLOYED — deploying requires Cloudflare account access and
# maintainer approval. It does not touch DNS or any other pgx.dev route.
name = "pgx-install"
main = "install-worker.js"
compatibility_date = "2026-10-01"

# The route this Worker owns. Deploying this route REQUIRES that the configured
# Cloudflare account controls the pgx.dev zone — `wrangler deploy` fails if the
# account does not own `zone_name`, which is the enforcement point for
# "verify the account controls the zone" (see README).
routes = [
  { pattern = "pgx.dev/install", zone_name = "pgx.dev" },
]

# Pinned release ref the installer is served from. There is no fallback in the
# Worker: INSTALL_REF must be a full commit SHA, never a branch.
# Override per-deploy with:  wrangler deploy --var INSTALL_REF:<reviewed-40-character-commit-sha>
[vars]
INSTALL_REF = "d0df77764a3f697db7b12c67a1658e08a59bdb96"

# After merging installer changes, explicitly advance this pin to the reviewed
# merge commit before deploying. A tag is mutable and is not a deployment pin.
